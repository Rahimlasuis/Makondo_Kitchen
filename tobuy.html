<!DOCTYPE html>
<html lang="en">

<head>
  <meta=charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title>To Buy Shopping List</title>
    <style>
      body {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background-color: #5d62a0;
        color: #333;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .back_btn {
        color: white;
        text-decoration: none;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 14px;
        border-radius: 8px;
      }

      h1 {
        color: white;
        margin: 0;
      }

      .add_box {
        background: white;
        padding: 15px;
        border-radius: 12px;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      #itemInput {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      .add_btn {
        background: #166534;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 10px 15px;
        cursor: pointer;
        font-weight: bold;
      }

      .list_container {
        background: white;
        border-radius: 12px;
        padding: 15px;
      }

      .item_row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }

      .item_row:last-child {
        border-bottom: none;
      }

      .clr_btn {
        background: #fee2e2;
      }

      .clr_all_btn {
        width: 100%;
        background-color: #991b1b;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        cursor: pointer;
        font-weight: bold;
      }

      .empty_msg {
        text-align: center;
        color: #666;
        margin: 20px 0;
      }
    </style>
</head>

<body>
  <div class="container">
    <div clas="header">
      <a href="Kitchenpage.html" class="back_btn">Home</a>
      <h1>Shopping List</h1>
    </div>

    <div class="add_box">
      <input type="text" id="itemInput" placeholder="Add to list">
      <button class="add_btn" onclick="addItem()">Add</button>
    </div>

    <div class="list_container">
      <div id="shopping_list"></div>
      <button onclick="clearAllItems()" id="clr_all_btn" class="clr_all_btn" style="display: none;">Clear Entire
        List</button>
    </div>
  </div>

  <script>
    function renderList() {
      const list = JSON.parse(localStorage.getItem('toBuy')) || [];
      const container = document.getElementById('shopping_list');
      const clearAllBtn = document.getElementById('clr_all_btn');

      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = `
          <p class="empty_msg>Your Shopping list is empty</p>"`
        clearAllBtn.style.display = 'none';
        return
      }

      clearAllBtn.style.display = 'block';
      list.forEach((item, index) => {
        container.innerHTML += `
          <div class="item_row">
            <span>${item}</span>
            <button onclick="deleteItem(${index})" class="clr-btn">CLR</button>
          </div>
        `;
      });
    }

    function addItem() {
      const input = document.getElementById('itemInput');
      const val = input.value.trim();

      if (!val) {
        return;
      }
      const list = JSON.parse(localStorage.getItem('toBuy')) || [];
      list.push(val);
      localStorage.setItem('toBuy', JSON.stringify(list));

      input.value = '';
      renderList();
    }

    function deleteItem(index) {
      let list = JSON.parse(localStorage.getItem('toBuy')) || [];
      list.splice(index, 1);
      localStorage.setItem('toBuy', JSON.stringify(list));
      renderList();
    }

    function clearAllItems() {
      localStorage.removeItem('toBuy');
      renderList();
    }

    renderList();
  </script>
</body>

</html>
