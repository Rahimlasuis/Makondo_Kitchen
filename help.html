<div class="item">
    <div class="item_details">
        <span class="item_name">${item.name}</span>
        <span class="item_category">${item.category}</span>
        <button class="clear_single_bt">CLR</button>
    </div>
    <div class="item_status">
        <span class="item_qty">${item.amount}</span>
        <span class="item_expiry alert">
            <span class="item_exp_nu">${item.expiry || 'No'}</span> days left
        </span>
    </div>
</div>
