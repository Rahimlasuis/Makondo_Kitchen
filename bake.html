<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width" , initial-scale="1.0">
  <title>Make a Dish</title>
  <style>
    body {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      background-color: #5d62a0;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back_btn {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 8px;
    }

    h1 {
      color: white;
      margin: 0;
    }

    .recipe_card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .recipe_card:hover {
      background-color: orange;
    }

    .recipe_card:active {
      transform: scale(0.98);
    }

    .recipe_card h3 {
      margin: 0 0 6px 0;
      color: #333;
      font-size: 19px;
    }

    .recipe_card p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .nav_btn {
      background: #5d62a0;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .ingredient_list {
      background: #f3f4f6;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .ingredient_list li {
      margin-bottom: 6px;
    }

    .step_box {
      background: #f9fafb;
      border-left: 4px solid #5d62a0;
      padding: 12px;
      margin: 12px 0;
      border-radius: 0 8px 8px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .done_btn {
      width: 100%;
      background: #166534;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <a href="Kitchenpage.html" class="back_btn">Home</a>
      <h1>Make a Dish</h1>
    </div>
    <div id="dish_content">
      Loadinng..........................
    </div>
  </div>

  <script>
    const dishes = [
      {
        id: 1,
        title: "Jollof Rice",
        description: "Rich, delicious Nigerian Party Jollof",
        ingredients: ["Raw Rice", "Tomato Paste", "Chopped Onion", "Vegetable oil", "seasoning Cube", "Salt", "Bay Leave"],
        steps: [
          "Blend tomatoes, peppers, and onions into a smooth mixture.",
          "Fry tomato paste and the blended mixture in hot oil until oil floats to the top.",
          "Add stock, seasoning, and water; bring to a boil.",
          "Add Bay leaves",
          "Stir in washed rice, cover tightly, and cook on low heat until tender."
        ]
      },
      {
        id: 2,
        title: "Fried Plantains & Scrambled Eggs",
        description: "Quick sweet brownish plantains served with eggs.",
        ingredients: ["Ripe Plantains", "Large Eggs", "Vegetable Oil", "Salt & Pepper", "Diced Tomatoes & Onions"],
        steps: [
          "Peel and slice plantains into any shape of your peference.",
          "Fry plantain slices in hot oil until golden brown on both sides, then drain.",
          "Whisk eggs with salt, pepper, diced tomatoes, and onions.",
          "Scramble the eggs in a oiled pan and serve hot alongside the plantains."
        ]
      }
    ];

    function showDishList() {
      const container = document.getElementById('dish_content');
      container.innerHTML = '';
      dishes.forEach((dish, index) => {
        container.innerHTML += `<div class="recipe_card" onclick="showDishDetails(${index})">
            <h3>${dish.title}</h3>
            <p>${dish.description}</p>
          </div>`
      });
    }

    function showDishDetails(index) {
      const dish = dishes[index];
      const container = document.getElementById('dish_content');

      const ingredientsHTML = dish.ingredients.map(ing => `<li>${ing}</li>`).join('');
      const stepsHTML = dish.steps.map((step, i) => `
      <div class="step-box">
          <strong>Step ${i + 1}:</strong> ${step}
        </div>
      `).join('');

      container.innerHTML = `
        <div class="recipe_card" style="cursor: default;">
          <button onclick="showDishList()" class="nav_btn">← Back to Dishes</button>
          <h2>${dish.title}</h2>
          <p>${dish.description}</p>

          <h3>Ingredients Needed:</h3>
          <ul class="ingredient_list">
            ${ingredientsHTML}
          </ul>

          <h3 style="color: #5d62a0;">Preparation Steps:</h3>
          ${stepsHTML}

          <button onclick="showDishList()" class="done_btn">Finished Cooking!</button>
        </div>
      `;
    }

    showDishList();
  </script>
</body>

</html>
